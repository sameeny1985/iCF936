<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سامانه شبیه‌ساز و پردازشگر معماری اطلاعات FI9</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { background: #3498db; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background: #2980b9; }
        
        /* استایل جدول مرجع کدینگ */
        .codebook-section { background: #fff8e1; border: 1px solid #ffe082; padding: 15px; border-radius: 6px; margin-bottom: 25px; }
        .codebook-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 10px; }
        .codebook-item { background: white; border: 1px solid #ffd54f; padding: 10px; border-radius: 4px; text-align: center; width: 130px; font-size: 13px; }
        
        .result-section { margin-top: 30px; padding: 20px; background: #fafafa; border: 1px solid #e1e1e1; border-radius: 4px; }
        .matrices-wrapper { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-top: 15px; }
        
        /* استایل ماتریس با جدول 9 سلولی مرزی */
        .matrix-card { background: white; border: 1px solid #ddd; padding: 15px; border-radius: 6px; text-align: center; width: 160px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .grid-9-cells { 
            position: relative; 
            width: 120px; 
            height: 120px; 
            margin: 10px auto; 
            background: #fff; 
            border: 2px solid #333; 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            grid-template-rows: repeat(3, 1fr); 
        }
        .cell-box { border: 1px dashed #ccc; box-sizing: border-box; position: relative; }
        .pixel-dot { position: absolute; width: 8px; height: 8px; background: #e74c3c; border-radius: 50%; transform: translate(-50%, -50%); z-index: 2; }
        
        .metrics-box { display: flex; justify-content: space-between; background: #e8f8f5; padding: 15px; border-radius: 4px; margin-top: 20px; }
        @media print { body { background: white; } button, input { display: none; } }
    </style>
</head>
<body>
<div class="container">
    <h1>سامانه پردازشگر و تحلیلگر معماری FI9</h1>

    <!-- بخش راهنما و جدول کدینگ مرجع برای کاربر -->
    <div class="codebook-section">
        <h2>راهنمای جدول کدینگ مرجع FI9 (استاندارد سلول‌های ۹گانه)</h2>
        <p style="text-align: center; font-size: 14px; color: #555;">با استفاده از این جدول مرجع، می‌توانید ایندکس‌های ورودی را با الگوهای مصوب تطبیق دهید:</p>
        <div class="codebook-grid" id="codebookReference">
            <!-- از طریق جاوااسکریپت یا به صورت ثابت جدول پر می‌شود -->
        </div>
    </div>

    <div class="form-group">
        <label for="indicesInput">شماره ایندکس‌ها را وارد کنید (با کاما، فاصله یا خط فاصله، مثلاً: 1, 2, 3):</label>
        <input type="text" id="indicesInput" placeholder="مثال: 1, 2, 3">
    </div>
    <button onclick="processData()">اجرا و نمایش ماتریس‌های مستقل ۳×۳</button>

    <div class="result-section" id="resultSection" style="display:none;">
        <h3>نتیجه تحلیل و نمایش ماتریس‌های ۹ سلولی مستقل:</h3>
        <div class="matrices-wrapper" id="matricesContainer"></div>
        
        <div class="metrics-box" id="metricsBox"></div>
        <button onclick="window.print()" style="margin-top: 20px; background: #27ae60;">پرینت و خروجی PDF</button>
    </div>
</div>

<script>
// جدول مرجع کامل برای نمایش به کاربر
const globalCodebook = {
    1: { desc: "الگوی قطر اصلی", dots: [[0,0], [1,1], [2,2]] },
    2: { desc: "الگوی قطر فرعی", dots: [[0,2], [1,1], [2,0]] },
    3: { desc: "الگوی صلیبی", dots: [[0,1], [1,0], [1,2], [2,1]] },
    4: { desc: "الگوی چهارگوشه", dots: [[0,0], [0,2], [2,0], [2,2]] }
};

// بارگذاری جدول مرجع در بالای صفحه
window.onload = function() {
    const cbContainer = document.getElementById('codebookReference');
    for (let [key, val] of Object.entries(globalCodebook)) {
        let div = document.createElement('div');
        div.className = 'codebook-item';
        div.innerHTML = `<strong>ایندکس ${key}</strong><br><span style="font-size:11px; color:#666;">${val.desc}</span>`;
        cbContainer.appendChild(div);
    }
}

async function processData() {
    const val = document.getElementById('indicesInput').value;
    const response = await fetch('/process', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ indices: val })
    });
    const data = await response.json();
    if(data.success) {
        document.getElementById('resultSection').style.display = 'block';
        const container = document.getElementById('matricesContainer');
        container.innerHTML = '';
        
        data.matrices.forEach(item => {
            let card = document.createElement('div');
            card.className = 'matrix-card';
            
            let title = document.createElement('div');
            title.innerHTML = `<strong>ایندکس: ${item.index}</strong>`;
            card.appendChild(title);
            
            let desc = document.createElement('div');
            desc.style.fontSize = '11px';
            desc.style.color = '#666';
            desc.style.margin = '5px 0';
            desc.innerText = item.desc;
            card.appendChild(desc);

            // ساخت بوم با جدول 9 سلولی واقعی (Grid سه در سه)
            let gridContainer = document.createElement('div');
            gridContainer.className = 'grid-9-cells';
            
            // ساخت 9 سلول داخلی برای وضوح جدول مرزی
            for(let i=0; i<9; i++) {
                let cell = document.createElement('div');
                cell.className = 'cell-box';
                gridContainer.appendChild(cell);
            }

            // رسم نقاط مختص به ایندکس روی شبکه
            item.dots.forEach(pt => {
                let dot = document.createElement('div');
                dot.className = 'pixel-dot';
                // محاسبه دقیق مختصات درصد محورهای شبکه 3x3
                dot.style.left = (pt[0] * 33.33 + 16.66) + '%';
                dot.style.top = (pt[1] * 33.33 + 16.66) + '%';
                gridContainer.appendChild(dot);
            });
            
            card.appendChild(gridContainer);
            container.appendChild(card);
        });

        const m = data.metrics;
        document.getElementById('metricsBox').innerHTML = `
            <div><strong>حجم کل در معماری FI9:</strong> ${m.fi9_bits} بیت (${m.fi9_bytes} بایت)</div>
            <div><strong>حجم کل باینری سنتی:</strong> ${m.binary_bits} بیت (${m.binary_bytes} بایت)</div>
        `;
    }
}
</script>
</body>
</html>
